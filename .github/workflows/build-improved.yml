name: Build Improved Index

on:
  workflow_dispatch:
  push:
    paths:
      - 'PATCH.md'
      - 'scripts/**'
      - '.github/workflows/build-improved.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/apply_patch.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "chore: build improved index.html with SEO + lang=zh-Hant" && git push)
